# Render Blueprint — RetinaVision ML Backend
# Deploy via: https://dashboard.render.com/blueprints
#
# IMPORTANT: The Docker context is "ml-backend/" — the build only needs the
# ml-backend/ directory. best_model.pth must be present inside ml-backend/
# before deploying (commit it there, or add it as a Render Secret mounted at
# the working directory). The Dockerfile copies the whole context into /app.

services:
  - type: web
    name: retinavision-ml-backend
    runtime: docker
    region: oregon
    plan: free
    envVars:
      - key: MODEL_PATH
        value: best_model.pth
      - key: DEVICE
        value: cpu
    healthCheckPath: /health
    dockerfilePath: ml-backend/Dockerfile
    dockerContext: ml-backend
